<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanya | MCA Student & UI/UX Designer — Portfolio</title>
  <meta name="description" content="Clean minimalist portfolio built with React and Tailwind CSS featuring a pristine white and dark maroon aesthetic.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            maroon: {
              900: '#4a0e17',
              800: '#5c121d',
              700: '#751726',
              600: '#911e30',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #faf9f6; }
    ::-webkit-scrollbar-thumb { background: #5c121d; border-radius: 3px; }

    .minimal-card {
      background: #ffffff;
      border: 1px solid #eae6df;
      transition: all 0.3s ease;
    }
    .minimal-card:hover {
      border-color: #5c121d;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(92, 18, 29, 0.08);
    }

    @media print {
      body * { visibility: hidden; }
      #print-report-container, #print-report-container * { visibility: visible; }
      #print-report-container {
        position: absolute; left: 0; top: 0; width: 100%;
        background: white !important; color: black !important;
      }
    }
  </style>
</head>
<body class="bg-[#faf9f6] text-neutral-900 antialiased selection:bg-maroon-800 selection:text-white font-sans">
  <div id="root"></div>

  <script type="text/babel">

    };

    function App() {
      const [data, setData] = useState({
        personal: {

          behance: "https://behance.net/tanyadesign"

        projects: [

            title: "Health Management System", 
            category: "Final Year Project",

            githubUrl: "https://github.com/tnyaa15", 
            image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=800&q=80" 
          },

            id: 2, 
            title: "Student Management System", 
            category: "App Development", 
            desc: "Interactive application designed to streamline student enrollments, grade tracking, and academic record management.", 
            tech: ["JavaScript", "Express", "MongoDB", "UI/UX"], 
            githubUrl: "https://github.com/tnyaa15", 
            image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800&q=80" 
          },
          { 
            id: 3, 
            title: "Creative Blog App", 
            category: "Full-Stack App", 
            desc: "Modern blogging platform featuring rich text publishing, user authentication, and a clean editorial interface.", 
            tech: ["React", "Node.js", "Tailwind CSS", "Figma"], 
            githubUrl: "https://github.com/tnyaa15",

      const [showReportModal, setShowReportModal] = useState(false);

            <div className="font-serif text-xl font-bold tracking-tight text-neutral-900">

            <div className="flex items-center gap-4 text-xs font-mono">

              <div className="space-y-2">

            </section>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {data.projects.map((project) => (

                    <div>
                      <div className="relative h-44 rounded-xl overflow-hidden mb-4 bg-neutral-100">

                    </div>

                <h2 className="text-3xl font-serif font-bold text-neutral-900">Let's build something intentional.</h2>
                <p className="text-neutral-600 text-sm leading-relaxed font-light">

                </p>
                <div className="space-y-2 font-mono text-xs text-neutral-700 pt-2">

                  <input type="text" required className="w-full bg-white border border-neutral-200 rounded-xl p-3 text-sm text-neutral-900 focus:outline-none focus:border-maroon-800" placeholder="Jane Doe" />
                </div>
                <div>
                  <label className="block text-xs font-mono text-neutral-600 uppercase mb-1">Your Email</label>
                  <input type="email" required className="w-full bg-white border border-neutral-200 rounded-xl p-3 text-sm text-neutral-900 focus:outline-none focus:border-maroon-800" placeholder="jane@example.com" />
                </div>
                <div>
                  <label className="block text-xs font-mono text-neutral-600 uppercase mb-1">Message</label>
                  <textarea rows="4" required className="w-full bg-white border border-neutral-200 rounded-xl p-3 text-sm text-neutral-900 focus:outline-none focus:border-maroon-800" placeholder="Write your message..."></textarea>
                </div>
                <button type="submit" className="w-full py-3.5 rounded-xl bg-maroon-800 hover:bg-maroon-900 text-white font-mono uppercase tracking-wider text-xs transition-colors">

                </button>
              </form>
            </section>

          </main>

          {/* ACADEMIC REPORT MODAL */}

            <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-sm flex items-center justify-center p-4">

                  <div>

                    <p className="text-xs text-neutral-500 font-mono mt-1">Student: {data.personal.name} | ID: {data.personal.enrollmentNo}</p>
                  </div>
                  <button onClick={() => setShowReportModal(false)} className="text-neutral-400 hover:text-neutral-900 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-4 text-xs font-mono text-neutral-700">
                  <div className="p-4 rounded-xl bg-neutral-50 border border-neutral-200">
                    <strong>Hosted Website URL:</strong> <a href={data.personal.hostedUrl} className="text-maroon-800 underline block mt-1" target="_blank" rel="noreferrer">{data.personal.hostedUrl}</a>
                  </div>
                  <div className="p-4 rounded-xl bg-neutral-50 border border-neutral-200">
                    <strong>Technology Stack:</strong> HTML5, Tailwind CSS, React 18, JavaScript (Babel Standalone), Node.js, MongoDB
                  </div>
                  <div className="p-4 rounded-xl bg-neutral-50 border border-neutral-200">
                    <strong>AI Tools Utilized:</strong> ChatGPT (Architecture & synthesis), GitHub Copilot (Code completion), v0.dev (Minimalist layout ideation)

                  <div className="p-4 rounded-xl bg-neutral-50 border border-neutral-200">
                    <strong>Professional Links:</strong>
                    <ul className="list-disc pl-5 mt-1 space-y-1 text-xs text-maroon-800">
                      <li><a href={data.socialLinks.linkedin} target="_blank" rel="noreferrer" className="underline">LinkedIn Profile</a></li>
                      <li><a href={data.socialLinks.github} target="_blank" rel="noreferrer" className="underline">GitHub Profile</a></li>
                      <li><a href={data.socialLinks.behance} target="_blank" rel="noreferrer" className="underline">Behance UI/UX Portfolio</a></li>

            <p>© {new Date().getFullYear()} {data.personal.name} • Minimalist Maroon Edition</p>

        </div>

    ReactDOM.render(<App />, document.getElementById('root'));

</body>
</html>
